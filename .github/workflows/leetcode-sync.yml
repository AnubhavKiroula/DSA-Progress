name: 🔄 LeetCode Sync

on:
  # Run daily at 00:30 UTC
  schedule:
    - cron: "30 0 * * *"
  # Allow manual trigger from the Actions tab
  workflow_dispatch:
    inputs:
      force:
        description: "Force commit even if no changes detected"
        required: false
        default: "false"

permissions:
  contents: write   # needed to push commits

jobs:
  sync:
    name: Sync LeetCode Submissions
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # -----------------------------------------------------------------------
      # 1. Check out the repo (full history for clean diffs)
      # -----------------------------------------------------------------------
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 0

      # -----------------------------------------------------------------------
      # 2. Set up Python
      # -----------------------------------------------------------------------
      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      # -----------------------------------------------------------------------
      # 3. Install dependencies
      # -----------------------------------------------------------------------
      - name: 📦 Install dependencies
        run: pip install -r scripts/requirements.txt

      # -----------------------------------------------------------------------
      # 4. Run sync script
      # -----------------------------------------------------------------------
      - name: 🔍 Fetch and sync LeetCode submissions
        id: sync
        env:
          LEETCODE_SESSION: ${{ secrets.LEETCODE_SESSION }}
          PROBLEMS_DIR: problems
        run: python scripts/sync.py

      # -----------------------------------------------------------------------
      # 5. Commit and push (only when files changed)
      # -----------------------------------------------------------------------
      - name: 📝 Commit and push changes
        if: steps.sync.outputs.changes == 'true' || github.event.inputs.force == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/${{ github.repository }}.git
          git add problems/ README.md
          git diff --cached --quiet && echo "Nothing to commit" && exit 0
          # Use LeetHub-style message from sync script, fallback to date-based
          COMMIT_MSG="${{ steps.sync.outputs.commit_msg }}"
          if [ -z "$COMMIT_MSG" ]; then
            COMMIT_MSG="AutoSync: update LeetCode solutions [$(date -u +'%Y-%m-%d')]"
          fi
          git commit -m "$COMMIT_MSG"
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}

      # -----------------------------------------------------------------------
      # 6. Job summary
      # -----------------------------------------------------------------------
      - name: 📊 Job summary
        if: always()
        run: |
          echo "## 🔄 LeetCode Sync Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.sync.outputs.changes }}" = "true" ]; then
            echo "✅ **New solutions committed and pushed.**" >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️  **No new solutions found — nothing to commit.**" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "_Triggered by: \`${{ github.event_name }}\`_" >> $GITHUB_STEP_SUMMARY
